<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <!-- which build of the library the page runs, the scripts import it as a package -->
    <script type="importmap">
      {
        "imports": {
          "@nebula.js/stardust": "/apis/stardust/dist/stardust.esm.js",
          "@nebula.js/snapshooter": "/apis/snapshooter/client.js"
        }
      }
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #object {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: rgb(50, 50, 50);
      }
    </style>
  </head>
  <body>
    <div id="object"></div>
    <script type="module">
      import snapshooter from '@nebula.js/snapshooter';
      import { configured } from './configured.js';

      const params = (() => {
        const opts = {};
        window.location.search
          .substring(1)
          .split('&')
          .forEach((pair) => {
            const idx = pair.indexOf('=');
            const name = pair.substr(0, idx);
            const value = decodeURIComponent(pair.substring(idx + 1));
            opts[name] = value;
          });

        return opts;
      })();
      snapshooter({
        embed: configured,
        element: document.querySelector('#object'),
        snapshot: params.snapshot,
      });
    </script>
  </body>
</html>
