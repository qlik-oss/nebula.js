<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mashup</title>
    <!-- which build of the library the page runs, the scripts import it as a package -->
    <script type="importmap">
      {
        "imports": {
          "@nebula.js/stardust": "/apis/stardust/dist/stardust.esm.js"
        }
      }
    </script>
    <script type="module" src="snapper.js"></script>

    <style>
      body {
        background: #eee;
      }

      .object {
        display: inline-block;
        position: relative;
        width: 300px;
        height: 200px;
        margin: 16px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="object" data-type="pie"></div>
    <div class="object" data-type="bar"></div>
  </body>
</html>
