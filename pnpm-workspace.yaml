packages:
  - 'packages/*'
  - 'commands/*'
  - 'apis/*'
  - 'test/component'
  - 'test/integration'
  - 'test/mashup'
  - 'test/rendering'
  - 'test/fixtures/viz/*'

allowBuilds:
  '@parcel/watcher': false
  nx: false
  puppeteer: false
  unrs-resolver: false

overrides:
  'dts-dom': '3.7.0'
  'caniuse-lite': '1.0.30001806'
  'react': '19.2.8'
  'react-dom': '19.2.8'
  'react-is': '19.2.8'
  '@playwright/test': '^1.62.0'
  'minimatch@npm:^3.0.0': '^3.1.5'
  'minimatch@npm:^5.0.0': '^5.1.9'
  'minimatch@npm:^9.0.0': '^9.0.9'
  'minimatch@npm:^10.0.0': '^10.2.4'
  'tar@npm:^7.0.0': '^7.5.11'
  'glob@npm:^10.0.0': '^13.0.6'
  'glob@npm:^11.0.0': '^13.0.6'
