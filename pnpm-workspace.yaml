packages:
  - 'packages/*'
  - 'commands/*'
  - 'apis/*'
  - 'test/component'
  - 'test/integration'
  - 'test/mashup'
  - 'test/rendering'
  - 'test/fixtures/viz/*'

allowBuilds:
  '@parcel/watcher': false
  nx: false
  puppeteer: false
  unrs-resolver: false

overrides:
  # Optional peer of `debug`. Left unpinned it resolves to two versions, which
  # forks @emotion/react + @mui/material into duplicate instances and breaks
  # MUI's ThemeProvider context across workspace package boundaries.
  'supports-color': '11.0.0'
  'dts-dom': '3.7.0'
  'caniuse-lite': '1.0.30001822'
  'react': '19.3.1'
  'react-dom': '19.3.1'
  'react-is': '19.3.1'
  '@playwright/test': '^1.65.0'
  'minimatch@npm:^3.0.0': '^11.0.8'
  'minimatch@npm:^5.0.0': '^5.1.9'
  'minimatch@npm:^9.0.0': '^11.0.8'
  'minimatch@npm:^10.0.0': '^10.2.6'
  'tar@npm:^7.0.0': '^7.5.22'
  'glob@npm:^10.0.0': '^13.0.7'
  'glob@npm:^11.0.0': '^13.0.7'
