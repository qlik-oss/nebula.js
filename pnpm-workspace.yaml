packages:
  - 'packages/*'
  - 'commands/*'
  - 'apis/*'
  - 'test/component'
  - 'test/integration'
  - 'test/mashup'
  - 'test/rendering'
  - 'test/fixtures/viz/*'

allowBuilds:
  '@parcel/watcher': false
  nx: false
  puppeteer: false
  unrs-resolver: false

overrides:
  # Optional peer of `debug`. Left unpinned it resolves to two versions, which
  # forks @emotion/react + @mui/material into duplicate instances and breaks
  # MUI's ThemeProvider context across workspace package boundaries.
  'supports-color': '11.0.0'
  'dts-dom': '3.7.0'
  'caniuse-lite': '1.0.30001826'
  'react': '19.3.1'
  'react-dom': '19.3.1'
  'react-is': '19.3.1'
  '@playwright/test': '^1.65.1'
  'minimatch@^3.0.0': '^11.0.9'
  'minimatch@^5.0.0': '^5.1.9'
  'minimatch@^9.0.0': '^11.0.9'
  'minimatch@^10.0.0': '^11.0.9'
  'tar@^7.0.0': '^7.5.23'
  'glob@^10.0.0': '^14.0.6'
  'glob@^11.0.0': '^14.0.6'
