name: Setup workspace
description: Set up pnpm, restore the turbo cache and build the workspace. Requires the repository to be checked out.

inputs:
  save-cache:
    description: Save the pnpm store and the turbo cache after the job. Only one job per workflow should do this.
    default: 'false'
  build:
    description: Build the whole workspace. Disable for jobs whose turbo tasks build what they need.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
      with:
        cache: true
        save-cache: ${{ inputs.save-cache }}
    - name: Restore turbo cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-
    - name: Restore and save turbo cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-
    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: pnpm run build
