name: CI

on:
  push:
    branches: [main, 'alpha/**']
    tags: ['v*']
  pull_request:

env:
  JEST_JUNIT_OUTPUT_DIR: ./coverage/junit/
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
        with:
          save-cache: true

  validate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
        with:
          build: false
      - name: Locale verify
        run: pnpm run locale:verify
      - name: format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Run unit tests and publish to codeclimate
        env:
          JEST_JUNIT_OUTPUT_DIR: ./coverage/junit/
        run: pnpm test:coverage
      - name: Store junit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit
          path: coverage/junit
      - name: Publish junit test report
        if: ${{ always() && hashFiles('coverage/junit/*.xml') != '' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Unit Tests
          path: coverage/junit/*.xml
          reporter: jest-junit
          fail-on-error: false

  test-integration:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Test component
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: component-junit.xml
        run: pnpm run test:component
      - name: Publish component test report
        if: ${{ always() && hashFiles('test-results/component-junit.xml') != '' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Component Tests
          path: test-results/component-junit.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test mashup
        run: pnpm run test:mashup
      - name: Store mashup artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mashup
          path: |
            ./test/mashup/reports
            ./test/mashup/test-results
      - name: Publish mashup test report
        if: ${{ always() && hashFiles('test/mashup/reports/xml/*.xml') != '' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Mashup Tests
          path: test/mashup/reports/xml/*.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test integration
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: integration-junit.xml
        run: pnpm run test:integration
      - name: Publish integration test report
        if: ${{ always() && hashFiles('test-results/integration-junit.xml') != '' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Integration Tests
          path: test-results/integration-junit.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test rendering
        run: pnpm run test:rendering
      - name: Store rendering artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendering
          path: |
            ./test/rendering/reports
            ./test/rendering/test-results
      - name: Publish rendering test report
        if: ${{ always() && hashFiles('test/rendering/reports/xml/*.xml') != '' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Rendering Tests
          path: test/rendering/reports/xml/*.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test visual (serve /dev route)
        env:
          SERVE_TEST_PORT: 8700
          CI: 'true'
        # --update-snapshots=missing writes baselines that don't exist yet
        # (first run on a new platform) without overwriting existing ones.
        # Existing baselines are still compared normally, so regressions fail.
        run: pnpm test:visual:update-missing
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-snapshots
          # Upload the full snapshot directory so newly-generated linux baselines
          # (*-linux.png) can be downloaded, reviewed, and committed to the repo.
          path: |
            ./commands/serve/test/reports/
            ./commands/serve/test/e2e/dev-route.spec.js-snapshots

  test-create:
    name: test-create-${{ matrix['picasso-template'] != 'none' && matrix['picasso-template'] || 'basic' }}${{ matrix.mashup && '-mashup' || '' }}${{ matrix.typescript && '-ts' || '' }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - picasso-template: none
            mashup: false
            install: false
            build: true
            test: true
            typescript: false
          - picasso-template: barchart
            mashup: false
            install: false
            build: true
            test: true
            typescript: false
          - picasso-template: none
            mashup: false
            install: false
            build: true
            test: false
            typescript: true
          - picasso-template: none
            mashup: true
            install: true
            build: true
            test: false
            typescript: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
      - name: Create Nebula ${{ matrix.mashup && 'mashup' || 'visualization' }} project with template (${{ matrix.picasso-template }})
        id: create-project
        env:
          PICASSO_TEMPLATE: ${{ matrix.picasso-template }}
          MASHUP: ${{ matrix.mashup }}
          INSTALL: ${{ matrix.install }}
          BUILD: ${{ matrix.build }}
          TEST: ${{ matrix.test }}
          TYPESCRIPT: ${{ matrix.typescript }}
        run: |
          set -x
          PROJECT_FOLDER=$(mktemp -d)/$PICASSO_TEMPLATE
          .github/scripts/nebula_create.sh $PROJECT_FOLDER "$PICASSO_TEMPLATE" "$MASHUP" "$INSTALL" "$BUILD" "$TEST" "$TYPESCRIPT"
          echo "PROJECT_FOLDER=$PROJECT_FOLDER" >> $GITHUB_OUTPUT
      - name: Store project screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots-${{ matrix.picasso-template }}-${{ matrix.mashup && 'mashup' || 'visualization' }}
          path: ${{ steps.create-project.outputs.PROJECT_FOLDER }}/screenshots

  test-react:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
      - name: Build and test React based chart
        run: .github/scripts/nebula_react.sh "$(mktemp -d)/react-chart"

  api-governance:
    uses: ./.github/workflows/api-governance.yml
    secrets: inherit
