name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  JEST_JUNIT_OUTPUT_DIR: ./coverage/junit/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2
        with:
          cache: true
      - name: Build
        run: pnpm run build
      - name: Remove node_modules
        run: find . -name node_modules -type d -prune -exec rm -rf {} +
      - name: Upload workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace
          path: |
            **/dist/**
            apis/locale/all.json
            apis/snapshooter/client.js
          retention-days: 1

  validate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2
        with:
          cache: true
      - name: Download workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workspace
          path: .
      - name: Locale verify
        run: pnpm run locale:verify
      - name: format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Run unit tests and publish to codeclimate
        env:
          JEST_JUNIT_OUTPUT_DIR: ./coverage/junit/
        run: pnpm test:unit --coverage
      - name: Store junit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit
          path: coverage/junit
      - name: Publish junit test report
        if: ${{ always() && hashFiles('coverage/junit/*.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Unit Tests
          path: coverage/junit/*.xml
          reporter: jest-junit
          fail-on-error: false

  test-integration:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2
        with:
          cache: true
      - name: Download workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workspace
          path: .
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Test component
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: component-junit.xml
        run: pnpm run test:component
      - name: Publish component test report
        if: ${{ always() && hashFiles('test-results/component-junit.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Component Tests
          path: test-results/component-junit.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test mashup
        run: pnpm run test:mashup
      - name: Store mashup artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mashup
          path: |
            ./test/mashup/reports
            ./test/mashup/test-results
      - name: Publish mashup test report
        if: ${{ always() && hashFiles('test/mashup/reports/xml/*.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Mashup Tests
          path: test/mashup/reports/xml/*.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test integration
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: integration-junit.xml
        run: pnpm run test:integration
      - name: Publish integration test report
        if: ${{ always() && hashFiles('test-results/integration-junit.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Integration Tests
          path: test-results/integration-junit.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test rendering
        run: pnpm run test:rendering
      - name: Store rendering artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rendering
          path: |
            ./test/rendering/reports
            ./test/rendering/test-results
      - name: Publish rendering test report
        if: ${{ always() && hashFiles('test/rendering/reports/xml/*.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Rendering Tests
          path: test/rendering/reports/xml/*.xml
          reporter: jest-junit
          fail-on-error: false
      - name: Test visual (serve /dev route)
        env:
          SERVE_TEST_PORT: 8700
          CI: 'true'
        # --update-snapshots=missing writes baselines that don't exist yet
        # (first run on a new platform) without overwriting existing ones.
        # Existing baselines are still compared normally, so regressions fail.
        run: pnpm test:visual:update-missing
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-snapshots
          # Upload the full snapshot directory so newly-generated linux baselines
          # (*-linux.png) can be downloaded, reviewed, and committed to the repo.
          path: |
            ./commands/serve/test/reports/
            ./commands/serve/test/e2e/dev-route.spec.js-snapshots

  test-create:
    name: ${{ format('create: {0}{1}{2}', matrix['picasso-template'], matrix.mashup && ', mashup' || '', matrix.typescript && ', ts' || '') }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - picasso-template: none
            mashup: false
            install: false
            build: true
            test: true
            typescript: false
          - picasso-template: barchart
            mashup: false
            install: false
            build: true
            test: true
            typescript: false
          - picasso-template: none
            mashup: false
            install: false
            build: true
            test: false
            typescript: true
          - picasso-template: none
            mashup: true
            install: true
            build: true
            test: false
            typescript: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2
        with:
          cache: true
      - name: Download workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workspace
          path: .
      - name: Create Nebula ${{ matrix.mashup && 'mashup' || 'visualization' }} project with template (${{ matrix.picasso-template }})
        id: create-project
        env:
          PICASSO_TEMPLATE: ${{ matrix.picasso-template }}
          MASHUP: ${{ matrix.mashup }}
          INSTALL: ${{ matrix.install }}
          BUILD: ${{ matrix.build }}
          TEST: ${{ matrix.test }}
          TYPESCRIPT: ${{ matrix.typescript }}
        run: |
          set -x
          PROJECT_FOLDER=$(mktemp -d)/$PICASSO_TEMPLATE
          .github/scripts/nebula_create.sh $PROJECT_FOLDER "$PICASSO_TEMPLATE" "$MASHUP" "$INSTALL" "$BUILD" "$TEST" "$TYPESCRIPT"
          echo "PROJECT_FOLDER=$PROJECT_FOLDER" >> $GITHUB_OUTPUT
      - name: Store project screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshots-${{ matrix.picasso-template }}-${{ matrix.mashup && 'mashup' || 'visualization' }}
          path: ${{ steps.create-project.outputs.PROJECT_FOLDER }}/screenshots

  api-governance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2
        with:
          cache: true

      - name: Create version.txt
        id: version
        run: |
          set -x
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
          else
            pnpm --filter "@nebula.js/stardust" version preminor
            pnpm spec
            version=$(node -p "require('./apis/stardust/api-spec/spec.json').info.version")
          fi
          echo "$version" > ./version.txt
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Building $version"

      - name: Prepare API Compliance
        run: |
          docker pull ghcr.io/qlik-download/api-compliance
          docker create -v /specs --name specs alpine:3.4 /bin/true
          docker cp ./apis/stardust/api-spec/spec.json specs:/specs
          docker cp ./apis/stardust/api-spec/listbox-spec.json specs:/specs

      - name: Run API Compliance
        env:
          CREDENTIALS_S3_SECRETKEY: ${{ secrets.APICULTURIST_S3 }}
          CREDENTIALS_GITHUB: ${{ secrets.APICULTURIST_GITHUB }}
          CREDENTIALS_COLONY: ${{ secrets.APICULTURIST_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          VER: v${{ steps.version.outputs.version }}
        run: |
          docker run --volumes-from specs \
            -e SPEC_PATHS="abdc47c2-921a-45d3-ba5c-80d448574c5b@/specs/spec.json,ba0bcf91-d7a6-4048-a36a-ad9a2dc8c03e@/specs/listbox-spec.json" \
            -e COMMIT_SHA="$COMMIT_SHA" \
            -e RELEASE_TAG="$VER" \
            -e PRE_RELEASE="true" \
            -e CREDENTIALS_S3_SECRETKEY="$CREDENTIALS_S3_SECRETKEY" \
            -e CREDENTIALS_GITHUB="$CREDENTIALS_GITHUB" \
            -e CREDENTIALS_COLONY="$CREDENTIALS_COLONY" \
            ghcr.io/qlik-download/api-compliance
